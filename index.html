<title>DUORY Pair Tag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFFCF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one phone screen. A stage where the two tag halves snap, a hand and a paw rise out of them and high-five; then a record card and the month's puzzle. */
:root{
  --cream:#FFFCF7; --soft:#F5EFE6; --line:#CDBFAD;
  --human:#8FBFDC; --human-ink:#4F86AA; --pet:#EDC1DC; --pet-ink:#B4739F;
  --green:#026839; --mocha:#6B5E4F;
  --c-walk:#8FBFDC; --c-vet:#9CCDB2; --c-groom:#EDC1DC; --c-play:#F2D88F; --c-trip:#EFC3A0; --c-etc:#DCD3C6;
  --display:"Syne", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--green);font-family:var(--body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));padding-block:18px 28px}
header{display:flex;align-items:center;justify-content:space-between}
.logo{width:92px;height:auto;cursor:pointer}
.tagline{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--mocha)}

/* stage: a fixed 600x300 "world" scaled to the stage width; the two tag halves are separate layers */
.stage{position:relative;border-radius:28px;background:var(--soft);overflow:hidden;aspect-ratio:600/300;width:100%}
.world{position:absolute;left:0;top:0;width:600px;height:300px;transform-origin:0 0}
.layer{position:absolute;display:block;will-change:transform;backface-visibility:hidden}
.piece{z-index:2;top:66px}
.blue{transform-origin:294px 108px;left:6px;width:342px;height:216px}
.pink{transform-origin:4px 108px;left:296px;width:298px;height:216px}
.click{z-index:3;left:0;width:600px;top:4px;text-align:center;font:700 40px var(--body);color:var(--green);opacity:0}

/* high-five pop-up shown right after the tag is read, then dismissed */
.pop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(255,252,247,.96);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);cursor:pointer}
.hfbox{position:relative;width:min(86vw,380px);aspect-ratio:400/460;overflow:hidden;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.hfbox svg{position:absolute;inset:0;width:100%;height:100%;will-change:transform;backface-visibility:hidden}
.fur{fill:var(--fur,#8A5A35)}
.furline{stroke:var(--furline,#5E3A20)}
.stripe{stroke:var(--stripe,transparent)}
.pop[data-pet="tantan"]{--fur:#D9D3CD;--furline:#9C928A;--stripe:#B0A79F}
.poptext{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:700 22px var(--body);color:var(--green);opacity:0}

.msg{text-align:center;display:flex;flex-direction:column;gap:4px}
.msg h1{margin:0;font-size:26px;font-weight:700;text-wrap:balance}
.msg p{margin:0;color:var(--mocha);font-size:14px;font-variant-numeric:tabular-nums}
.reveal{transition:opacity .45s,transform .45s}
.hide{opacity:0;transform:translateY(10px);pointer-events:none}

/* record card */
.card{border:1.5px solid var(--green);border-radius:20px;background:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font-size:18px;font-weight:700;text-align:center}
.label{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--mocha)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{font:600 13px var(--body);color:var(--green);border:0;border-radius:999px;padding:9px 6px;cursor:pointer;background:var(--c);transition:transform .15s}
.chip[data-cat=walk]{--c:var(--c-walk)}.chip[data-cat=vet]{--c:var(--c-vet)}.chip[data-cat=groom]{--c:var(--c-groom)}.chip[data-cat=play]{--c:var(--c-play)}.chip[data-cat=trip]{--c:var(--c-trip)}.chip[data-cat=etc]{--c:var(--c-etc)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--green)}
.sub{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:#EEF6F1}
.subchips{display:flex;flex-wrap:wrap;gap:6px}
.subchip{font:600 12px var(--body);color:var(--green);background:#fff;border:1.2px solid var(--c-vet);border-radius:999px;padding:6px 12px;cursor:pointer}
.subchip[aria-pressed="true"]{background:var(--c-vet);border-color:var(--green)}
.memo{width:100%;font:400 16px var(--body);color:var(--green);border:1.2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--cream)}
.memo::placeholder{color:#A39684}
.save{align-self:center;font:800 12px var(--display);letter-spacing:.14em;color:var(--cream);background:var(--green);border:0;border-radius:999px;padding:14px 30px;cursor:pointer}
.save:disabled{opacity:.4;cursor:default}
.hint{margin:-6px 0 0;text-align:center;font-size:12px;color:var(--mocha);min-height:1em}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* month */
.month{display:flex;flex-direction:column;gap:12px}
.month .top{display:flex;justify-content:space-between;align-items:baseline}
.eyebrow{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.14em}
.count{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,300px);align-self:center}
.cell{aspect-ratio:1;border-radius:8px;border:1.2px dashed var(--line)}
.cell.on{border:0;background:var(--c)}
.cell.new{animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--mocha)}
.legend span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.log li{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px}
.log .d{color:var(--mocha);font-variant-numeric:tabular-nums}
.log b{font-weight:700}
.log .m{color:var(--mocha);overflow-wrap:anywhere}
.ghost{align-self:center;font:600 13px var(--body);color:var(--green);background:none;border:1.5px solid var(--green);border-radius:999px;padding:10px 20px;cursor:pointer}
.note{font-size:11px;color:var(--mocha);text-align:center;line-height:1.6;margin-top:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:1ms!important}}
</style>

<script>
(function(){
  var CATS={
    walk:{n:"산책",c:"var(--c-walk)"}, vet:{n:"병원",c:"var(--c-vet)"}, groom:{n:"미용·목욕",c:"var(--c-groom)"},
    play:{n:"놀이",c:"var(--c-play)"}, trip:{n:"카페·여행",c:"var(--c-trip)"}, etc:{n:"직접 입력",c:"var(--c-etc)"}
  };
  var VET_PH={"건강검진":"예: 혈액검사 정상, 체중 6.2kg","예방접종":"예: 종합백신 3차, 다음 접종 12월","아파서":"예: 귀 염증, 약 5일","약 받기":"예: 심장사상충 약","기타":"어떤 일로 갔는지 적어 주세요"};
  var PETS={kaka:{name:"카카",head:"오늘도 함께!",cat:"walk"},tantan:{name:"탄탄",head:"같이 노는 중!",cat:"play"}};
  var SAMPLE=["walk","walk","play","walk","groom","walk","vet","walk","play","trip","walk","walk"];

  var $=function(id){return document.getElementById(id)};
  var stage=$("stage"),msg=$("msg"),card=$("card"),month=$("month"),memo=$("memo"),hint=$("hint");
  var pet,cat=null,sub=null,timers=[];
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function later(fn,ms){timers.push(setTimeout(fn,reduce?0:ms))}
  function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
  function load(){try{var v=JSON.parse(localStorage.getItem("duory-log")||"[]");return Array.isArray(v)?v:[]}catch(e){return[]}}
  function keep(v){try{localStorage.setItem("duory-log",JSON.stringify(v))}catch(e){}}
  var records=load();
  function pad(n){return String(n).padStart(2,"0")}
  function now(){var d=new Date();return{t:pad(d.getHours())+":"+pad(d.getMinutes()),d:pad(d.getMonth()+1)+"."+pad(d.getDate())}}
  function setPet(){pet=PETS[(location.hash||"").replace("#","")]||PETS.kaka}

  function pick(c){
    cat=c;
    document.querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.cat===c?"true":"false")});
    $("vetbox").hidden=c!=="vet";
    if(c!=="vet"){sub=null;document.querySelectorAll(".subchip").forEach(function(b){b.setAttribute("aria-pressed","false")})}
    memo.placeholder=c==="etc"?"어떤 순간이었나요? (필수)":c==="vet"?(sub?VET_PH[sub]:"병원 메모 (선택)"):"한 줄 메모 (선택)";
    hint.textContent="";
  }

  function cells(){
    var all=SAMPLE.concat(records.map(function(r){return r.cat}));
    var start=Math.floor(Math.max(all.length-1,0)/20)*20;
    return all.slice(start,start+20);
  }
  function drawMonth(fresh){
    var list=cells(),g=$("grid");g.innerHTML="";
    for(var i=0;i<20;i++){
      var el=document.createElement("div");el.className="cell";
      if(i<list.length){el.className+=" on";el.style.setProperty("--c",CATS[list[i]].c);if(fresh&&i===list.length-1)el.className+=" new"}
      g.appendChild(el);
    }
    $("count").textContent=list.length+" / 20 조각";
    var counts={};list.forEach(function(k){counts[k]=(counts[k]||0)+1});
    $("legend").innerHTML=Object.keys(CATS).filter(function(k){return counts[k]}).map(function(k){
      return '<span><i style="--c:'+CATS[k].c+'"></i>'+CATS[k].n+' '+counts[k]+'</span>'}).join("");
    var log=$("log");log.innerHTML="";
    records.slice(-3).reverse().forEach(function(r){
      var li=document.createElement("li");
      var d=document.createElement("span");d.className="d";d.textContent=r.d;
      var body=document.createElement("span");
      var b=document.createElement("b");b.textContent=CATS[r.cat].n+(r.sub?" · "+r.sub:"");
      body.appendChild(b);
      if(r.memo){var m=document.createElement("div");m.className="m";m.textContent=r.memo;body.appendChild(m)}
      li.appendChild(d);li.appendChild(body);log.appendChild(li);
    });
  }


  /* stage scaling + animation (Web Animations: transforms only, so it stays on the GPU) */
  var world=$("world"),anims=[];
  function fit(){world.style.transform="scale("+(stage.clientWidth/600)+")"}
  window.addEventListener("resize",fit);fit();
  function A(el,frames,opt){
    if(!el.animate){var last=frames[frames.length-1];for(var k in last)if(k!=="offset"&&k!=="easing")el.style[k]=last[k];return}
    opt.fill="both";if(reduce){opt.duration=1;opt.delay=0}
    anims.push(el.animate(frames,opt));
  }
  var OUT="cubic-bezier(.22,1,.36,1)",IN="cubic-bezier(.55,0,.9,.4)",SOFT="cubic-bezier(.3,.7,.4,1)";
  function animateStage(delay){
    A($("blue"),[{transform:"translateX(-260px) scale(1)",easing:OUT},{transform:"translateX(0) scale(1)",offset:.68,easing:"ease-out"},{transform:"translateX(0) scale(1.035)",offset:.8,easing:"ease-in-out"},{transform:"translateX(0) scale(1)"}],{duration:1030,delay:delay});
    A($("pink"),[{transform:"translateX(260px) scale(1)",easing:OUT},{transform:"translateX(0) scale(1)",offset:.68,easing:"ease-out"},{transform:"translateX(0) scale(1.035)",offset:.8,easing:"ease-in-out"},{transform:"translateX(0) scale(1)"}],{duration:1030,delay:delay});
    A($("click"),[{opacity:0,transform:"translateY(14px) scale(.9)",easing:OUT},{opacity:1,transform:"none",offset:.25},{opacity:1,transform:"none",offset:.7},{opacity:0,transform:"translateY(-8px)"}],{duration:1100,delay:delay+680});
  }
  var pop=$("pop");
  function closePop(){pop.hidden=true}
  function popup(){
    pop.hidden=false;pop.dataset.pet=stage.dataset.pet;
    var D=1500;
    A($("hand"),[
      {transform:"translate(-62%,58%) rotate(-10deg)",easing:OUT},
      {transform:"translate(-7%,2%) rotate(-3deg)",offset:.5},
      {transform:"translate(-9%,2%) rotate(-4deg)",offset:.58,easing:IN},
      {transform:"translate(0,0) rotate(0)",offset:.68,easing:"ease-out"},
      {transform:"translate(-1.8%,0) rotate(-.8deg)",offset:.74,easing:"ease-in-out"},
      {transform:"translate(0,0) rotate(0)",offset:.84},
      {transform:"translate(0,0) rotate(0)"}],{duration:D,delay:150});
    A($("paw"),[
      {transform:"translate(62%,58%) rotate(10deg)",easing:OUT},
      {transform:"translate(7%,2%) rotate(3deg)",offset:.5},
      {transform:"translate(9%,2%) rotate(4deg)",offset:.58,easing:IN},
      {transform:"translate(0,0) rotate(0)",offset:.68,easing:"ease-out"},
      {transform:"translate(1.8%,0) rotate(.8deg)",offset:.74,easing:"ease-in-out"},
      {transform:"translate(0,0) rotate(0)",offset:.84},
      {transform:"translate(0,0) rotate(0)"}],{duration:D,delay:150});
    A($("burst"),[{opacity:0,transform:"translateY(10px) scale(.6)"},{opacity:1,transform:"none",offset:.35,easing:OUT},{opacity:1,transform:"none",offset:.7},{opacity:0,transform:"translateY(-6px)"}],{duration:800,delay:150+D*.68});
    A(pop,[{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.82},{opacity:0}],{duration:2350,delay:0});
    later(function(){buzz([20,30,25])},150+D*.68);
    later(closePop,2350);
  }
  pop.addEventListener("click",function(){anims.forEach(function(a){if(a.effect&&a.effect.target&&pop.contains(a.effect.target)||a.effect&&a.effect.target===pop){try{a.finish()}catch(e){}}});closePop()});

  function play(){
    timers.forEach(clearTimeout);timers=[];
    setPet();
    stage.dataset.pet=(location.hash||"").replace("#","")==="tantan"?"tantan":"kaka";
    [msg,card,month].forEach(function(el){el.classList.add("hide")});
    month.hidden=true;card.hidden=false;memo.value="";pick(pet.cat);
    $("headline").textContent=pet.head;
    $("sub").textContent=pet.name+" · "+now().t;
    anims.forEach(function(a){a.cancel()});anims=[];
    popup();
    animateStage(2250);
    later(function(){buzz(50)},2950);
    later(function(){msg.classList.remove("hide")},3350);
    later(function(){card.classList.remove("hide")},3650);
  }

  document.querySelectorAll(".chip").forEach(function(b){b.addEventListener("click",function(){pick(b.dataset.cat)})});
  document.querySelectorAll(".subchip").forEach(function(b){
    b.addEventListener("click",function(){
      sub=b.textContent;
      document.querySelectorAll(".subchip").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
      memo.placeholder=VET_PH[sub];hint.textContent="";
    });
  });
  function saveIt(){
    var text=memo.value.trim();
    if(cat==="vet"&&!sub){hint.textContent="병원에 간 이유를 골라 주세요.";return}
    if(cat==="etc"&&!text){hint.textContent="어떤 순간이었는지 한 줄 적어 주세요.";memo.focus();return}
    records.push({d:now().d,cat:cat,sub:sub,memo:text});
    if(records.length>200)records=records.slice(-200);
    keep(records);
    card.hidden=true;month.hidden=false;drawMonth(true);
    requestAnimationFrame(function(){month.classList.remove("hide")});
    buzz(40);
  }
  $("save").addEventListener("click",saveIt);
  memo.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();saveIt()}});
  $("again").addEventListener("click",play);
  $("logo").addEventListener("click",play);
  window.addEventListener("hashchange",play);
  play();
})();
</script>
